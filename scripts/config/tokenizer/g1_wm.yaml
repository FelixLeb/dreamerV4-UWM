# @package _global_
defaults:
 - /dataset: g1_wm
 - _self_

reload_checkpoint: null
# Init from the SOAR pretrained tokenizer; arch must match (see below).
tokenizer_ckpt: /scratch/rk4342/projects/dreamer-v4/checkpoints/tokenizer_ckpts/soar.pt
output_dir: checkpoints/tokenizer_ckpts/g1_wm/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 100
log_every: 25
save_every: 5000
seed: 42

tokenizer:
  # NOTE: arch must stay identical to soar.pt for strict-load to succeed.
  dual_stream: false
  num_modality_tokens: 256    # image_size (256) // patch_size (16) -> 16x16 = 256
  num_latent_tokens: 256
  context_length: 32
  max_sequence_length: 128
  model_dim: 1024
  latent_dim: 32
  enc_num_layers: 4
  dec_num_layers: 4
  n_heads: 16
  n_kv_heads: 16
  dropout_prob: 0.0
  qk_norm: false
  patch_size: 16

train:
  use_compile: true
  num_epochs: 60
  batch_per_gpu: 1
  grad_accum_steps: 1
  lr: 1e-4
  weight_decay: 0.01
  num_workers: 12
  lpips_weight: 0.2
  mixed_precision: false
  enable_fast_matmul: true
  clip_grad_norm: 1.0

wandb:
  enable: true
  api_key: null
  project: "dreamer-v4-tokenizer"
  run_name: null
