# @package _global_
defaults:
 - /tokenizer: /g1

dual_stream: false
# REQUIRED: model weights are initialized from this checkpoint; optimizer
# and scheduler start fresh (no `reload_checkpoint` resume). Override per
# experiment from the slurm script.
dynamics_ckpt: /scratch/rk4342/projects/dreamerV4-UWM/checkpoints/dynamics/g1-may19-unified-scratch-v2/122500.pt
reload_checkpoint: null
output_dir: checkpoints/align/mix-uwm-g1/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 50
log_every: 25
save_every: 1000
seed: 42

# Two independent datasets — play (broad pretraining) and demo (task-specific).
# Both go through `create_distributed_dataloader` with the same window length
# (= denoiser.max_sequence_length). Source routing per alignment path is in
# `train.align.play_fractions` below.
dataset:
  kind: g1_chunked
  dt: 0.1
  resolution: [256, 256]
  load_to_ram: false
  play_data_dir: /scratch/rk4342/datasets/G1/wm
  demo_data_dir: /scratch/rk4342/datasets/G1/demo
  split_seed: 123
  train_episodes_fraction: 0.9
  # Legacy single-source field unused by the alignment loader; kept for code
  # paths that may read cfg.dataset.data_dir.
  data_dir: /scratch/rk4342/datasets/G1/wm

denoiser:
  # Must match the play-trained G1 checkpoint architecture exactly (see
  # scripts/config/dynamics/g1-large.yaml).
  dual_stream: false
  num_action_tokens: 1
  num_latent_tokens: 256       # must match tokenizer.num_latent_tokens
  num_register_tokens: 4
  context_length: 64           # temporal-attention window
  max_sequence_length: 128     # also drives the alignment loader window
  model_dim: 1536
  latent_dim: 32               # must match tokenizer.latent_dim
  n_layers: 6
  n_heads: 24                  # head_dim = 1536/24 = 64
  n_kv_heads: 24
  dropout_prob: 0.0
  qk_norm: false
  num_noise_levels: 128
  n_actions: 22                # G1 commands: 3 base vel + 17 upper-body + 2 triggers
  is_causal: true
  layer_types: [spatial, temporal, spatial, temporal]
  train_reward_model: false
  mtp_length: 8
  # Must match the pretrained checkpoint's setting. Pretraining on
  # g1-large.yaml uses horizon_aware=true; keep it on here so the
  # frame_id_embedder shape matches at load time.
  horizon_aware: true

train:
  device: 'cuda:0'
  use_compile: true            # compile+LoRA is fragile; auto-disabled when lora.enabled=true
  # Single source of truth for run length: total optimizer (gradient) steps.
  num_training_steps: 30000
  batch_per_gpu: 1             # play batch size — long sequences (T=128) on G1-large fit ~1/GPU
  demo_batch_per_gpu: 1        # demo batch size
  accum_grad_steps: 2
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 12
  mixed_precision: false
  enable_fast_matmul: true
  clip_grad_norm: 1.0
  # Warmup is short since we start from a pretrained dynamics checkpoint
  # (no need to re-walk the early-LR regime).
  warmup_steps: 100
  absolute_actions: false      # ignored by g1_chunked loader; kept for shape compat

  # Reward-MTP ignored unless denoiser.train_reward_model=true.
  reward_weight: 1.0

  # =========================================================================
  # Alignment routing: paths and per-path source mixing.
  # =========================================================================
  align:
    # Path mixture: weight per alignment path. Need not sum to 1 — normalized
    # internally. Set any to 0 to disable that path entirely.
    #   wm              → UnifiedForwardProcess with θ forced to π/2 (state noisy, action clean)
    #   id              → UnifiedForwardProcess with θ forced to 0   (action noisy, state clean)
    #   video           → VideoPretrainingForwardProcess              (right edge: state marginal)
    #   action_sampler  → ActionPretrainingForwardProcess             (top edge:  action marginal)
    path_weights:
      wm:             0.25
      id:             0.25
      video:          0.25
      action_sampler: 0.25

    # Per-path P(play). The remainder of each path's draws come from demo.
    # Defaults are the "consistent" routing (no marginal mismatch):
    #   wm broad (Play+Demo); id, video, action_sampler all anchored to demo.
    # Bump `action_sampler` above 0 to ablate the action-marginal inconsistency
    # (then p(a) becomes broader than ∫p(a|s)p(s)ds — see script docstring).
    play_fractions:
      wm:             0.5
      id:             0.0
      video:          0.0
      action_sampler: 0.0

  # =========================================================================
  # Unified-loss knobs (consumed inside UnifiedForwardProcess + compute_unified_uwm_loss).
  # θ-mixture knobs below are present for the constructor's sanity check but
  # are NOT used during alignment — the train script forces θ per path.
  # =========================================================================
  unified:
    action_noise_std: 1.0
    # Placeholder θ-mixture (unused during alignment, see note above).
    theta_id_prob: 0.15
    theta_policy_prob: 0.15
    theta_wm_prob: 0.15
    theta_continuum_prob: 0.55
    # r-profile mixture is INHERITED here — the same step / progressive /
    # constant / diffusion_forcing / reverse_step variations apply within
    # the wm and id paths (just with θ forced).
    profile_step_prob: 0.3
    profile_progressive_prob: 0.15
    profile_constant_prob: 0.15
    profile_diffusion_forcing_prob: 0.4
    profile_reverse_step_prob: 0.15
    r_beta_alpha: 1.0
    r_beta_beta: 1.0
    causal_eps: 1.0e-3
    ramp_beta: 0.33
    # Coin-flip P(bidirectional attention) for the marginal pretraining
    # forward processes (video, action_sampler).
    pretraining_bidir_prob: 0.5
    # diffusion_forcing_bidir_prob applies to the corresponding r-profile
    # inside the unified diffuser when wm/id paths pick that profile.
    diffusion_forcing_bidir_prob: 0.5
    # RMS loss scaler — equalizes obs vs act flow-matching loss magnitudes
    # via a running per-modality EMA of loss². Mirrors the knob added to
    # train_dynamics_uwm_new.py. State isn't checkpointed; first ~100 steps
    # post-resume run slightly mis-scaled while the EMA reconverges.
    rms_scale_loss: true
    rms_scale_decay: 0.99

# Optional LoRA. Default OFF (full fine-tune); flip lora.enabled=true to try
# the LoRA variant later.
lora:
  enabled: false
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules: "all-linear"
  modules_to_save: null
  save_merged_final: true      # only used when lora.enabled=true

wandb:
  enable: false
  project: "UWM-align-uwm"
  run_name: null
