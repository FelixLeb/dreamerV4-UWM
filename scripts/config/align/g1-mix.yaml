# @package _global_
defaults:
 - /tokenizer: /g1

dual_stream: false
# REQUIRED: model weights are initialized from this checkpoint; optimizer
# and scheduler start fresh (no `reload_checkpoint` resume). Override per
# experiment from the slurm script.
dynamics_ckpt: /scratch/rk4342/projects/dreamerV4-UWM/checkpoints/dynamics/g1-may14-fixed/98300.pt
reload_checkpoint: null
output_dir: checkpoints/align/mix-g1/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 50
log_every: 25
save_every: 1000
seed: 42

# Two independent datasets — play (broad pretraining) and demo (task-specific).
# Both go through `ShardedHDF5Dataset` via `create_distributed_dataloader` with
# the same window length (= denoiser.max_sequence_length).
dataset:
  kind: g1_chunked
  dt: 0.1
  resolution: [256, 256]
  load_to_ram: false
  play_data_dir: /scratch/rk4342/datasets/G1/wm
  demo_data_dir: /scratch/rk4342/datasets/G1/demo
  split_seed: 123
  train_episodes_fraction: 0.9
  # Legacy single-source field unused by the mix loader; kept for code paths
  # that read cfg.dataset.data_dir.
  data_dir: /scratch/rk4342/datasets/G1/wm

denoiser:
  # Match the play-trained G1 checkpoint architecture exactly (see
  # scripts/config/dynamics/g1-large.yaml).
  dual_stream: false
  num_action_tokens: 1
  num_latent_tokens: 256       # must match tokenizer.num_latent_tokens
  num_register_tokens: 4
  context_length: 64           # temporal-attention window
  max_sequence_length: 128     # also drives the loader window in train_align_mix.py
  model_dim: 1536
  latent_dim: 32               # must match tokenizer.latent_dim
  n_layers: 6
  n_heads: 24                  # head_dim = 1536/24 = 64
  n_kv_heads: 24
  dropout_prob: 0.0
  qk_norm: false
  num_noise_levels: 128
  n_actions: 22                # G1 commands: 3 base vel + 17 upper-body + 2 triggers
  is_causal: true
  layer_types: [spatial, temporal, spatial, temporal]
  train_reward_model: false
  mtp_length: 8

train:
  device: 'cuda:0'
  use_compile: true            # compile+LoRA is fragile; auto-disabled when lora.enabled=true
  # Single source of truth for run length: total optimizer (gradient) steps.
  num_training_steps: 30000
  batch_per_gpu: 1             # play batch size — long sequences (T=128) on G1-large fit ~1/GPU
  demo_batch_per_gpu: 1        # demo batch size
  accum_grad_steps: 2
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 12
  mixed_precision: false
  enable_fast_matmul: true
  clip_grad_norm: 1.0
  # Warmup length in grad steps. When null, falls back to 5% of num_training_steps.
  warmup_steps: 500
  loss_weighting: uniform      # 'uniform' or 'ramp'
  absolute_actions: false      # ignored by g1_chunked loader; kept for shape compat

  # Mode-sampling weights. Only listed modes with nonzero weight will be
  # exercised. Mode → source routing happens inside the training loop:
  #   wm, id            → 'mixed' (controlled by `wmid_play_fraction`)
  #   video, forcing,
  #   policy            → 'demo' only
  mode_weights:
    wm: 2.5
    forcing: 1.0
    policy: 0.5
    id: 0.0
    video: 0.0

  # Fraction of `wm`/`id` draws that come from play (the remainder from demo).
  wmid_play_fraction: 0.5

  # Forcing-mode context noise (only matters when forcing has weight > 0).
  forcing_context_noise:
    bias: 0.0
    alpha: 0.5
    beta: 2.0
  forcing_mask_actions: false

  # Reward-MTP ignored unless denoiser.train_reward_model=true.
  reward_weight: 1.0

# Optional LoRA. Default OFF (full fine-tune) for the baseline; flip
# `lora.enabled=true` to try the LoRA variant later.
lora:
  enabled: false
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules: "all-linear"
  modules_to_save: null
  save_merged_final: true      # only used when lora.enabled=true

wandb:
  enable: false
  project: "UWM-align-mix"
  run_name: null
