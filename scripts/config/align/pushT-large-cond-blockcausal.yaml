# @package _global_
# Block-causal / unified alignment with AdaLN-Zero class conditioning
# (pushT-large, 1024). Consumed by scripts/train_align_cond_new.py.
defaults:
 - /tokenizer: /pushT

dual_stream: false
# REQUIRED base weights (1024-dim pushT large, unified-loss pretrained). Loaded
# strict=False; conditioning params zero-initialized. VERIFY the arch matches.
dynamics_ckpt: /scratch/rk4342/projects/dreamerV4-UWM/checkpoints/dynamics/pushT-may19-unified-loss-large/45000.pt
reload_checkpoint: null
output_dir: checkpoints/align/cond-new-pushT-large/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 50
log_every: 25
save_every: 1000
seed: 42

dataset:
  has_states: true
  has_actions: true
  kind: sharded_hdf5
  play_data_dir: /scratch/rk4342/datasets/pushT/play
  demo_data_dir: /scratch/rk4342/datasets/pushT/ablation/sharded-demo
  data_dir: /scratch/rk4342/datasets/pushT/play
  train_episodes_fraction: 1.0
  split_seed: 123

denoiser:
  dual_stream: false
  num_action_tokens: 1
  num_latent_tokens: 256
  num_register_tokens: 4
  context_length: 64
  max_sequence_length: 96
  model_dim: 1024
  latent_dim: 32
  n_layers: 8
  n_heads: 16
  n_kv_heads: 16
  dropout_prob: 0.0
  qk_norm: false
  num_noise_levels: 128
  n_actions: 2
  is_causal: true
  layer_types: [spatial, temporal, spatial, temporal]
  train_reward_model: false
  mtp_length: 8
  horizon_aware: true
  # --- AdaLN-Zero class conditioning (null / play / demo) ---
  cond_adaln: true
  num_cond_classes: 3

train:
  device: 'cuda:0'
  use_compile: true
  num_training_steps: 100000
  warmup_steps: 500
  batch_per_gpu: 8
  long_seq_batch_per_gpu: 1
  short_sequence_length: 32
  long_seq_prob: 0.15
  image_prob: 0.1
  image_batch_per_gpu: 64
  accum_grad_steps: 2
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 12
  enable_fast_matmul: true
  clip_grad_norm: 1.0
  reward_weight: 1.0
  absolute_actions: false

  freeze_backbone: true
  null_play_fraction: 0.5

  unified:
    action_noise_std: 1.0
    theta_id_prob: 0.15
    theta_policy_prob: 0.15
    theta_wm_prob: 0.15
    theta_continuum_prob: 0.55
    profile_step_prob: 0.15
    profile_progressive_prob: 0.15
    profile_constant_prob: 0.15
    profile_diffusion_forcing_prob: 0.4
    profile_reverse_step_prob: 0.3
    r_beta_alpha: 1.0
    r_beta_beta: 1.0
    causal_eps: 1.0e-3
    ramp_beta: 0.33
    mode_probs:
      unified: 0.333
      video_pretraining: 0.333
      action_pretraining: 0.333
      block_causal_sanity: 0.0
    pretraining_bidir_prob: 0.5
    diffusion_forcing_bidir_prob: 0.5
    rms_scale_loss: true
    rms_scale_decay: 0.99
    block_causal:
      block_sizes: [1, 2, 4, 8, 16]
      ctx_dropout_prob: 0.1
      ctx_tau_idx_min: null
      ctx_tau_idx_max: null
      couple_modality_tau: false

lora:
  enabled: false
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules: "all-linear"
  modules_to_save: null
  save_merged_final: true

wandb:
  enable: false
  project: "UWM-align-cond"
  run_name: null
