# @package _global_
defaults:
 - /tokenizer: /pushT

dual_stream: false
# REQUIRED: model weights are initialized from this checkpoint; optimizer
# and scheduler start fresh (no `reload_checkpoint` resume).
dynamics_ckpt: /home/mim-server/projects/rooholla/dreamerV4-UWM/checkpoints/dynamics/pushT/final/joint-model/v1/432360.pt
reload_checkpoint: null
output_dir: checkpoints/align/mix-pushT/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 50
log_every: 25
save_every: 1000
seed: 42

# Two independent datasets — play (broad pretraining) and demo (task-specific).
# Both go through `ShardedHDF5Dataset` with the same window length.
dataset:
  dt: 0.2
  resolution: [256, 256]
  load_to_ram: true
  play_data_dir: /home/mim-server/datasets/pushT/sharded
  demo_data_dir: /home/mim-server/datasets/pushT/sharded-demo
  split_seed: 123
  train_episodes_fraction: 1.0
  # Legacy single-source field unused here; kept for code paths that read cfg.dataset.data_dir.
  data_dir: /home/mim-server/datasets/pushT/sharded
  kind: sharded_hdf5

denoiser:
  # Match the play-trained reference checkpoint architecture exactly.
  dual_stream: false
  num_action_tokens: 1
  num_latent_tokens: 256
  num_register_tokens: 4
  context_length: 64
  max_sequence_length: 64
  model_dim: 768
  latent_dim: 32
  n_layers: 6
  n_heads: 12
  n_kv_heads: 12
  dropout_prob: 0.0
  qk_norm: false
  num_noise_levels: 128
  n_actions: 2
  is_causal: true
  layer_types: [spatial, temporal, spatial, temporal]
  train_reward_model: false

train:
  device: 'cuda:0'
  use_compile: false           # off by default; compile+LoRA is fragile
  num_epochs: 10
  batch_per_gpu: 4             # play batch size
  demo_batch_per_gpu: 4        # demo batch size (can be smaller if memory-bound)
  accum_grad_steps: 2
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 8
  mixed_precision: false
  enable_fast_matmul: true
  clip_grad_norm: 1.0
  num_training_steps: 1.0e7    # used only by the cosine; effective horizon is num_epochs * steps/epoch
  # Optional cap on micro-steps per epoch. `null` = use full play-loader pass.
  # Useful for smoke tests and for keeping epochs manageable when play >> demo.
  steps_per_epoch: null
  # Fixed warmup length (grad steps). When null, falls back to 5% of total
  # grad steps — too long for long runs that start from a pretrained ckpt.
  # Override at the CLI for short warmups, e.g. `train.warmup_steps=500`.
  warmup_steps: 500
  loss_weighting: uniform      # 'uniform' or 'ramp'
  absolute_actions: false

  # Mode-sampling weights. Only listed modes with nonzero weight will be
  # exercised. Mode → source routing happens inside the training loop:
  #   wm, id            → 'mixed' (50/50 by default; see `wmid_play_fraction`)
  #   video, forcing,
  #   policy            → 'demo' only
  mode_weights:
    wm: 2.5
    forcing: 1.0
    policy: 0.5
    id: 0.0
    video: 0.0

  # Fraction of `wm`/`id` draws that come from play (the remainder from demo).
  wmid_play_fraction: 0.5

  # Forcing-mode context noise (only matters when forcing has weight > 0).
  forcing_context_noise:
    bias: 0.0
    alpha: 0.5
    beta: 2.0
  forcing_mask_actions: false

  # Reward-MTP ignored unless denoiser.train_reward_model=true.
  reward_weight: 1.0

# Optional LoRA. Default OFF (full fine-tune) for the baseline; flip
# `lora.enabled=true` to try the LoRA variant later.
lora:
  enabled: false
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules: "all-linear"
  modules_to_save: null
  save_merged_final: true      # only used when lora.enabled=true

wandb:
  enable: false
  project: "UWM-align-mix"
  run_name: null
