# @package _global_
# Reward-head fine-tuning recipe (option 2):
#   - frozen world model loaded from `dynamics_ckpt` (must be a checkpoint
#     trained without the reward head — strict=False on load).
#   - only `agent_token` + `reward_head.*` get gradients.
#   - 70% clean / 30% per-frame uniform-τ noise schedule for some robustness
#     to noisy intermediate diffusion samples (see RewardOnlyForwardProcess).
#   - single training branch (no long/image/short); window_size = context_length.
defaults:
 - /tokenizer: /pushT

dual_stream: false
dynamics_ckpt: null    # REQUIRED at launch — path to pretrained WM checkpoint
reload_checkpoint: null
output_dir: checkpoints/dynamics/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 200
log_every: 25
save_every: 10000
seed: 42

denoiser:
  dual_stream: false
  num_action_tokens: 1
  num_latent_tokens: 256
  num_register_tokens: 4
  context_length: 64
  max_sequence_length: 96
  model_dim: 768
  latent_dim: 32
  n_layers: 6
  n_heads: 12
  n_kv_heads: 12
  dropout_prob: 0.0
  qk_norm: false
  num_noise_levels: 128
  n_actions: 2
  is_causal: true
  layer_types: [spatial, temporal, spatial, temporal]
  # MUST be true here — the script asserts this. The agent_token + reward_head
  # are added by this flag and are the only trainable params in this run.
  train_reward_model: true
  mtp_length: 8

train:
  device: 'cuda:0'
  use_compile: true
  num_epochs: 20             # head fine-tuning is fast — fewer epochs than full WM training

  batch_per_gpu: 8           # window_size = context_length here, so we can fit more per batch than the WM script's `batch_per_gpu`
  context_length: 64

  accum_grad_steps: 1
  lr: 3e-4                   # head with random init likes a slightly higher LR than the 1e-4 used for full WM training
  weight_decay: 0.0          # AdamW arg in the script
  num_workers: 12
  enable_fast_matmul: true
  clip_grad_norm: 1.0
  absolute_actions: false
  action_noise_std: 1.0

  # Reward-only knobs ------------------------------------------------------
  # Probability that an entire batch element is run with τ pinned to clean
  # (max idx) for both obs and act streams. On the complement, τ is sampled
  # per-frame uniformly from the full diffusion grid.
  reward_clean_prob: 0.7

# Stop-gap label-free reward synthesis for fine-tuning the head while real
# per-frame rewards aren't yet written into the shards. When
# `use_demo_play_mix=true`, the loader serves a 50/50 mix of windows from a
# demo dir and a play dir; each window gets a synthesized per-frame reward:
#   - play  → play_reward  (default 0.0) everywhere
#   - demo  → demo_reward  (default 1.0) everywhere, except the last
#             goal_frames of the source episode → goal_reward (default 20.0)
# Defaults preserve current behavior (`use_demo_play_mix=false` → falls back
# to the standard single-dir loader at cfg.dataset.data_dir).
dataset:
  use_demo_play_mix: false
  demo_data_dir: null    # required when use_demo_play_mix=true
  play_data_dir: null    # required when use_demo_play_mix=true
  goal_reward: 20.0
  demo_reward: 1.0
  play_reward: 0.0
  goal_frames: 5
  # Probability that a demo draw uses a "terminal window" (start ==
  # ep_length - window_size, so the goal frames are guaranteed inside).
  # The remaining fraction is uniform random across all demo windows. Set
  # to 0.0 to recover the pure-random behavior.
  terminal_bias: 0.5

wandb:
  enable: true
  project: "UWM-dynamics"
  run_name: null
