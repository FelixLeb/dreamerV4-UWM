# @package _global_
defaults:
 - /tokenizer: /pushT

dual_stream: false
dynamics_ckpt: null 
reload_checkpoint: null
output_dir: checkpoints/dynamics/${now:%Y-%m-%d_%H-%M-%S}
plot_every: 1000
print_every: 2000
log_every: 25
save_every: 50000
seed: 42

denoiser:
  dual_stream: false
  num_action_tokens: 1    # Number of tokens for the image or other modalities
  num_latent_tokens: 256      # The number of latent tokens per frame
  num_register_tokens: 4
  context_length: 64           # temporal-attention window
  max_sequence_length: 96      # long-branch T == loader window size
  model_dim: 768              # The dimension of the transformer latents
  latent_dim: 32              # The dimention of the encoder output latents (z)
  n_layers: 6           # Causal tokenizer encoder depth
  n_heads: 12
  n_kv_heads: 12
  dropout_prob: 0.0
  qk_norm: false
  num_noise_levels: 128
  n_actions: 2
  is_causal: true
  layer_types: [spatial, temporal, spatial, temporal]
  # Reward / MTP head. Off by default → no agent token, no extra params,
  # bit-equivalent to runs without these fields.
  train_reward_model: false
  mtp_length: 8

train:
  device: 'cuda:0'
  use_compile: true
  num_epochs: 110

  # Short/long mixed-batch training (Dreamer-V4 length-generalization trick).
  # Loader batches at long_seq_batch_per_gpu × max_sequence_length; with prob
  # long_seq_prob the long shape is used, otherwise random ctx_len crop.
  batch_per_gpu: 8 # Batch size for short sequences.
  long_seq_batch_per_gpu: 1
  short_sequence_length: 32    # short-branch crop T (independent from denoiser.context_length)
  long_seq_prob: 0.15
  # Image branch (Dreamer-V4 "30% as images"): reshape (B, T) -> (B*T, 1) for
  # unconditional single-frame training. Cheap; bump image_batch_per_gpu later.
  image_prob: 0.1
  image_batch_per_gpu: 64

  accum_grad_steps: 2
  lr: 1e-4
  num_workers: 12
  lpips_weight: 0.2

  warmup_samples: 4200 # ~1.5 hours with the current settings
  total_samples: 520000 # ~150 hours with the current settings; adjust as needed for longer/shorter training
  mixed_precision: false
  enable_fast_matmul: true
  clip_grad_norm: 1.0
  # `uniform` (not `ramp`) — ramp down-weights the noisy end which is the wrong
  # bias for forcing/mode-3 training.
  loss_weighting: ramp
  reward_weight: 1.0
  # Best recipe so far: forcing dominates, wm has 2× weight; everything else 0.
  mode_weights:
    policy: 0.5
    video: 0
    wm: 2.5
    id: 0
    forcing: 1
    action_only: 0
  forcing_mask_actions: false  # actions co-noised with state in forcing mode
  video_pretraining: false
  absolute_actions: false      # ignored by g1_chunked loader; kept for shape compat
  forcing_context_noise:
    bias: 0.0
    alpha: 0.5
    beta: 2.0
  shortcut:
    flow_bias: 0.75
    ema_decay: 0.0
    
wandb:
  enable: true
  project: "UWM-dynamics"
  run_name: null
