# Isolated AUTOREGRESSIVE edge-sampler sweep.
#
# The autoregressive sampler does ~2*horizon primitive rollout calls per edge, so its
# trees are MUCH slower than `imagine` / `two_stage` (order minutes, not seconds, per
# tree). Keep it in its own run so it doesn't stall the fast samplers, and give its SLURM
# array a bigger `--array` size and a longer `--time` than the main sweep.
#
# This config FIXES `edge_mode=autoregressive` and focuses the OFAT on the knobs that only
# matter for the AR sampler — the added-action-noise exploration (`action_noise` /
# `action_noise_dist`) — plus the other diversity levers. The base config is deliberately
# cheaper (shorter horizon / fewer iterations / shallower tree) than the main sweep; run a
# ~10-tree timing task first and set `--time` from it (see study/README.md).
#
# Same loader as run_sweep.py (not @hydra.main). CLI: key=value dotlist overrides.

output_dir: ???            # REQUIRED, e.g. /scratch/<net_id>/mcts_sweep/run_ar
seed: 0                    # (random mode only) seed for initial-context sampling
n_random: 16              # rollouts for the greedy baseline (imagine-based -> cheap, unaffected by AR)

# initial contexts: a curated set (recommended) or random sampling
inits:
  mode: file                              # "file" = curated (below) | "random" = sample n_inits
  path: inits/pushT_curated.yaml          # generated by curate.py; relative to this config dir
# NOTE: 40 curated inits x the configs below is a lot of AR trees. On a cluster this is fine
# (the array parallelises across inits); locally, cap jobs with `--limit N`, or point
# `inits.path` at a smaller curated file.
n_inits: 20               # used ONLY when inits.mode == random
Tc: 8                      # context window length (frames)

model:
  dynamics_ckpt: /home/mim-server/projects/rooholla/dreamerV4-UWM/checkpoints/blockcausal/pushT-post-train/97500.pt
  tokenizer_ckpt: /home/mim-server/projects/rooholla/dreamerV4-UWM/checkpoints/tokenizer/pushT.pt
  config_name: dynamics/pushT-large
  overrides: [denoiser.horizon_aware=false]

data:
  data_dir: /home/mim-server/datasets/pushT/h5/play
  window_size: 64

reward:
  kind: angle             # center | straight | angle  (fixed per sweep; run separate sweeps to compare)
  center_xy: [0.5, 0.5]
  sigma: 0.25
  combine: weighted_sum    # product (centered AND oriented) | weighted_sum (w_center/w_orient)
  w_center: 0.5
  w_orient: 0.5
  target_theta_deg: 90.0
  sigma_theta_deg: 20.0
  target_heading_deg: -90.0
  sigma_heading_deg: 25.0

descriptor:
  kind: auto               # auto (heading iff reward.kind=angle, else pose) | pose | heading
  dup_eps: 0.05
  dup_eps_heading: 0.06
  orient_weight: 0.5

# baseline PlanConfig — edge_mode FIXED to autoregressive, and cheaper than the main sweep
# (AR cost ~ 2*horizon*K denoiser passes per edge). action_noise>0 in the base so the
# normal-vs-uniform OFAT below is meaningful.
base_plan:
  horizon: 12               # AR cost is ~linear in horizon; keep it modest
  branching: 4
  edge_mode: autoregressive # <-- the whole point of this file
  sim_horizon: 12
  sim_rollouts: 2
  n_iterations: 16
  c_ucb: 0.5
  gamma: 0.98
  n_min: 0
  max_depth: 2              # shallower than the main sweep (each edge is expensive)
  K_steps: 6
  ctx_noise: 0.5
  ctx_noise_honest: true
  action_temp: 1.0
  action_prior: normal      # flow prior shape: normal (action_temp*N(0,I)) | uniform (std-matched)
  state_prior: normal       # obs noise prior the horizon state starts from, unit-scale
                            #   (no state_temp): normal N(0,I) | uniform (std-matched)
  action_noise: 0.3         # added-action-noise magnitude (base > 0 so the dist OFAT below is live)
  action_noise_dist: normal # shape of the added noise: normal | uniform (std-matched)
  max_ctx: 16

sweep:
  # OFAT — one factor at a time from base_plan (edge_mode stays autoregressive throughout).
  # Centred on the AR-only exploration knobs; `action_noise=0.0` gives the "no added noise"
  # control, and `action_noise_dist` is compared at the base action_noise=0.3.
  ofat:
    action_noise:      [0.0, 0.1, 0.3, 0.5]   # THE knob: extra noise added to each policy action
    action_noise_dist: [normal, uniform]       # its shape (only bites when action_noise > 0)
    ctx_noise:         [0.0, 0.5, 0.9]         # obs-context diversity lever
    action_temp:       [0.5, 1.0, 1.5]         # flow-prior dispersion
    action_prior:      [normal, uniform]       # flow-prior shape
    state_prior:       [normal, uniform]       # obs-prior shape
    # `horizon` is left OUT of the OFAT on purpose: it scales AR cost ~linearly and would
    # make some configs much slower. Add `horizon: [8, 12, 20]` if you want it, and budget
    # `--time` for the longest.
  random:
    n_samples: 0             # set e.g. 200 for a Tier-2 joint sample (expensive under AR!)
    seed: 0
