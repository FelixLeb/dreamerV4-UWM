# Full two-tier sweep (see ../../mcts_study_plan.md §5). Override output_dir on the CLI.
# OmegaConf yaml loaded by run_sweep.py (not @hydra.main). CLI: key=value dotlist overrides.

output_dir: ???            # REQUIRED, e.g. /scratch/<net_id>/mcts_sweep/run1
seed: 0                    # (random mode only) seed for initial-context sampling
n_random: 16              # baseline undirected rollouts for g_shootN

# initial contexts: a curated set (recommended) or random sampling
inits:
  mode: file                              # "file" = curated (below) | "random" = sample n_inits
  path: inits/pushT_curated.yaml          # generated by curate.py; relative to this config dir
# used ONLY when inits.mode == random:
n_inits: 20               # initial contexts per config (drives seed-variance / success-rate F4)
Tc: 8                      # context window length (frames)

model:
  dynamics_ckpt: /home/mim-server/projects/rooholla/dreamerV4-UWM/checkpoints/blockcausal/pushT-post-train/97500.pt
  tokenizer_ckpt: /home/mim-server/projects/rooholla/dreamerV4-UWM/checkpoints/tokenizer/pushT.pt
  config_name: dynamics/pushT-large
  overrides: [denoiser.horizon_aware=false]

data:
  data_dir: /home/mim-server/datasets/pushT/h5/play
  window_size: 64

reward:
  kind: angle             # center | straight | angle  (fixed per sweep; run separate sweeps to compare)
  center_xy: [0.5, 0.5]
  sigma: 0.25
  # --- orientation term: used by kind=straight|angle, ignored by kind=center ---
  combine: weighted_sum    # product (centered AND oriented) | weighted_sum (w_center/w_orient)
  w_center: 0.5
  w_orient: 0.5
  # kind=straight — reward the T's principal AXIS being vertical (upright == upside-down):
  target_theta_deg: 90.0
  sigma_theta_deg: 20.0
  # kind=angle — reward the T being UPRIGHT (upside-down penalised); calibrate on a known
  # upright decoded frame via debug['heading_deg'] if -90 looks wrong:
  target_heading_deg: -90.0
  sigma_heading_deg: 25.0

descriptor:
  kind: auto               # auto (heading iff reward.kind=angle, else pose) | pose | heading
  dup_eps: 0.05            # kind=pose: near-duplicate threshold in axis T-pose space (normalised)
  dup_eps_heading: 0.06    # kind=heading: recalibrated (true-dup p95=0.056; flips sit at ~1.0, never merged)
  orient_weight: 0.5       # kind=heading: (cos,sin) orientation scale

# baseline PlanConfig; OFAT perturbs one factor at a time from here
base_plan:
  horizon: 20
  branching: 5
  edge_mode: imagine
  sim_horizon: 20
  sim_rollouts: 3
  n_iterations: 32
  c_ucb: 0.5
  gamma: 0.98
  n_min: 0
  max_depth: 3
  K_steps: 6
  ctx_noise: 0.5
  ctx_noise_honest: true
  action_temp: 1.0
  action_prior: normal      # action noise prior: normal (action_temp*N(0,I)) | uniform (std-matched)
  max_ctx: 16

sweep:
  # Tier 1 — one factor at a time (interpretable main effects)
  ofat:
    ctx_noise:     [0.0, 0.3, 0.5, 0.7, 0.9]
    horizon:       [6, 12, 20, 28]
    sim_horizon:   [8, 16, 28]
    branching:     [3, 5, 8]
    action_temp:   [0.5, 1.0, 1.5]
    action_prior:  [normal, uniform]
    c_ucb:         [0.5, 2.0, 8.0]
    max_depth:     [2, 3, 5]
    n_iterations:  [16, 32, 48]
  # Tier 2 — random joint samples over the same grids (interactions + predictive model)
  random:
    n_samples: 0             # set e.g. 500 for the full Tier-2 run
    seed: 0
